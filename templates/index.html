
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MovieMatch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/" class="logo">MovieMatch.</a>
    </nav>

    <main class="home">
        <div class="emoji">🎬</div>
        <h1>Movie night, solved.</h1>
        <p>Stop scrolling. Start matching.<br>
           Find a movie you both love.</p>

        <div class="buttons">
            <form action="/create" method="POST">
                <button class="primary" type="submit">
                    Create Room
                </button>
            </form>

            <a class="secondary btn" href="/join">
                Join Room
            </a>
        </div>
    </main>
</body>
</html>
